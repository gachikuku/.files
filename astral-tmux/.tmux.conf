# Keep modified keys distinguishable in Pi and other terminal applications.
# These options require tmux 3.4; older releases still run on two VPSes.
if-shell -F '#{>=:#{version},3.4}' {
    set -g extended-keys on
    set -g extended-keys-format csi-u
}

set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi

# Reverse of the primary tmux status colours. Only the current window is bold.
set -g status-position top
set -g status "on"
set -g status-style 'fg=#f2f0e5,bg=#6f6e69,nobold'
set -g status-justify left

setw -g window-status-separator ''
setw -g window-status-style 'fg=#f2f0e5,bg=#6f6e69,nobold'
setw -g window-status-activity-style 'fg=#f2f0e5,bg=#6f6e69,nobold'
setw -g window-status-current-style 'fg=#f2f0e5,bg=#6f6e69,bold'
setw -g window-status-format '#[nobold] #I:#W'
setw -g window-status-current-format '#[bold] #I:#W'

# Keep the status contents inside a full-height bar. These custom font glyphs
# are the primary tmux caps flipped vertically: smooth on top, sharp below.
set -g status-left ''
set -g status-left-length 0
set -g status-right-length 16
# Use the SSH-facing names for hosts whose system hostname differs.
set -g status-right '#[fg=##f2f0e5,bg=##6f6e69,nobold] #{?#{==:#H,rpi},pi,#{?#{==:#H,vultr},kamil.gr,#H}} '
set -g status-format[0] '#[fg=##6f6e69,bg=##fffcf0]#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]#[fg=##6f6e69,bg=##fffcf0]'

# Match prompts to the top-mounted shape and reverse the primary prompt colours.
set -g message-style 'fg=#6f6e69,bg=#f2f0e5,fill=#f2f0e5,align=left,nobold'
set -g message-command-style 'fg=#6f6e69,bg=#f2f0e5,fill=#f2f0e5,align=left,nobold'
if-shell -F '#{>=:#{version},3.4}' {
    set -g message-format '#[fg=##f2f0e5,bg=##fffcf0]#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}#[align=right,fg=##f2f0e5,bg=##fffcf0]'
}

# Use Ctrl-b as the prefix.
set -g prefix C-b
bind C-b send-prefix

# Switch to the last visited window with Ctrl-b Space.
bind -r Space last-window

# Vim-style pane switching.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Scroll one line per wheel event.
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -N 1 -X scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -N 1 -X scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -N 1 -X scroll-down

bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

# Reload this configuration with Ctrl-b r.
bind r source-file ~/.tmux.conf \; display-message 'Reloaded ~/.tmux.conf'
