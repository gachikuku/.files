source-file ~/.files/tmux/.config/tmux/flexoki-light.tmuxtheme

set -ga terminal-overrides ",tmux-256color*:Tc"
set-option -g default-terminal "tmux-256color"
set -s escape-time 0
set-option -g repeat-time 0

unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

set -g history-limit 50000
# Forward mouse events to full-screen applications such as Tau.
set -g mouse on

# Mouse wheel scrolls line by line (tmux defaults to 5 lines per tick).
bind -T copy-mode    WheelUpPane   select-pane \; send -N1 -X scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -N1 -X scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -N1 -X scroll-down

bind r source-file ~/.files/tmux/.config/tmux/tmux.conf

set -g base-index 1
setw -g pane-base-index 1

#set -g status-style 'fg=green'

#set -g status-style 'fg=#879A39, bright'
#set -g status-style 'fg=#808080, bright'
set -g status-interval 1

# Paint command prompts and copy-mode searches across the entire status row.
# tmux 3.7 has a separate style for vi command mode; keeping both identical
# avoids a colour change when ':' or a search prompt switches key modes.
# These are the inverse of the normal Flexoki status colours.
set -g message-style         'fg=#f2f0e5,bg=#6f6e69,fill=#6f6e69,align=left'
set -g message-command-style 'fg=#f2f0e5,bg=#6f6e69,fill=#6f6e69,align=left'
# Match the normal status capsule while keeping prompts in their inverse style.
set -g message-format '#[fg=##6f6e69,bg=##fffcf0]#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}#[align=right,fg=##6f6e69,bg=##fffcf0]'

# bind -r ^ last-window
bind -r space last-window

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r D neww -c "#{pane_current_path}" "[ -e diary.md ] && nvim TODO.md || nvim ~/iCloud/diary/diary.md"
bind -r I neww -c "#{pane_current_path}" "[ -e index.md ] && nvim index.md || nvim ~/iCloud/index.md"

bind-key -r b movew -t1:
bind-key -r B movew -t0:

# Safari-style recently closed windows. Ctrl-s i closes immediately, Ctrl-s &
# asks first, and repeated Ctrl-s u restores retained windows newest-first.
bind w choose-tree -Zw
bind i run-shell '~/.files/tmux/.config/tmux/window-undo.sh close #{q:session_id} #{q:window_id} #{q:window_index}'
bind '&' confirm-before -p 'kill-window #W? (y/n)' { run-shell '~/.files/tmux/.config/tmux/window-undo.sh close #{q:session_id} #{q:window_id} #{q:window_index}' }
bind u run-shell '~/.files/tmux/.config/tmux/window-undo.sh restore #{q:session_id}'
unbind y
unbind T
# Keep the internal recovery session out of the normal session chooser.
bind s choose-tree -Zs -f '#{!=:#{session_name},__window_undo}'

# Need to copy like in vim
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe 'pbcopy'
# Copy mouse selections without leaving copy mode, matching the y binding.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'pbcopy'

# ── copy-mode indicator on the status bar ─────────────────────────────────
# Hide tmux's built-in top-right [pos/total] badge on every entry path; the
# same info (clock + position) is shown at the far right instead.
bind '[' copy-mode -H
bind PPage copy-mode -uH
bind -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -eH }
# Force w3m mouse drags through tmux copy mode; continue forwarding drags to
# every other mouse-aware full-screen application.
bind -n MouseDrag1Pane if -F '#{&&:#{!=:#{pane_current_command},w3m},#{||:#{pane_in_mode},#{mouse_any_flag}}}' { send-keys -M } { copy-mode -MH }

# In w3m, double-click selects a word and copies it to the macOS clipboard.
# Other mouse-aware applications keep receiving their own double-click events.
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F '#{&&:#{!=:#{pane_current_command},w3m},#{||:#{pane_in_mode},#{mouse_any_flag}}}' { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel 'pbcopy' }

# BEGIN managed status layout
# Rounded end glyphs turn the complete status row into one capsule. The cap
# colours are the existing Flexoki status background and terminal background.
# Windows remain left and stop before the reserved right-hand segment.
# Prayer is shown there normally; copy/view-mode information replaces it.
set -g status-justify left

set -g status-left ''
set -g status-left-length 0

set -g status-right-length 40
set -g status-right '#[fg=##6f6e69,bg=##f2f0e5]#{?#{m/r:^(copy|view)-mode$,#{pane_mode}},#[bold] #{t/p:top_line_time} [#{copy_position}/#{copy_position_limit}] ,#[nobold]#(PATH=/usr/bin:/bin $HOME/.files/tmux/.config/tmux/next-prayer.sh) }'

set -g status-format[0] '#[fg=##f2f0e5,bg=##fffcf0]#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]#[fg=##f2f0e5,bg=##fffcf0]'
# END managed status layout
#set -g status-position top

# nvim's checkhealth
set-option -g focus-events on

# Preserve modified keys such as Shift+Enter in Tau and other TUIs.
set -g extended-keys always
set -g extended-keys-format csi-u
set -g terminal-features[3] 'xterm-ghostty:extkeys'

#renumber!
set-option -g renumber-windows on

# New windows/panes keep current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
